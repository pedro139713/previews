<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Preview Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ====================================================================
   SETTINGS — edit these once before hosting
   ==================================================================== */
:root{
  --ink:#141414; --cream:#f6f1e7; --paper:#ffffff; --muted:#6b6b6b; --line:#e4ddd0;
  --accent:#c8281e; --accent-ink:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Roboto,system-ui,sans-serif;color:var(--ink);background:var(--cream);line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,.cond{font-family:"Barlow Condensed",Impact,sans-serif;text-transform:uppercase;letter-spacing:.01em;line-height:1}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* ================= BUILDER ================= */
#builder{display:grid;grid-template-columns:400px 1fr;height:100vh}
#panel{background:var(--ink);color:#eee;overflow-y:auto;padding:24px 22px 40px}
#panel h1{font-size:30px;color:#fff}
#panel h1 span{color:var(--accent)}
#panel .sub{color:#9a9a9a;font-size:13px;margin:6px 0 20px}
.sec{font-family:"Barlow Condensed";text-transform:uppercase;font-size:14px;letter-spacing:.12em;color:var(--accent);margin:22px 0 10px;border-top:1px solid #2a2a2a;padding-top:16px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:#aaa;margin-bottom:5px;font-weight:500}
.f label em{color:#666;font-style:normal}
.f input,.f select,.f textarea{width:100%;background:#1f1f1f;border:1px solid #333;border-radius:8px;padding:10px 12px;color:#fff;font-size:14px;outline:none;transition:border-color .15s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent)}
.f textarea{min-height:120px;resize:vertical;line-height:1.45}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline:2px solid #333;outline-offset:2px}
.sw.on{outline-color:#fff}
.actions{position:sticky;bottom:-40px;background:var(--ink);padding:16px 0 4px;margin-top:20px;display:grid;gap:8px}
.btn{border:0;border-radius:8px;padding:13px 16px;font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:.06em;font-size:17px;font-weight:700;cursor:pointer;transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:#fff}
.btn.sec2{background:#2a2a2a;color:#fff}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#fff;color:#111;padding:12px 18px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#stage{background:#d9d3c7;display:flex;flex-direction:column;min-width:0}
.stagebar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#cfc8bb;font-size:13px;color:#444}
.stagebar .dots{display:flex;gap:6px}.stagebar .dots i{width:11px;height:11px;border-radius:50%;background:#aaa;display:block}
.stagebar .url{flex:1;background:#eee9df;border-radius:6px;padding:5px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,monospace;font-size:12px}
.devtoggle button{background:transparent;border:1px solid #999;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12px}
.devtoggle button.on{background:#222;color:#fff;border-color:#222}
.framewrap{flex:1;display:flex;justify-content:center;padding:16px;overflow:hidden}
#frame{width:100%;height:100%;border:0;background:#fff;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.18);transition:width .3s}
#frame.mobile{width:390px}
@media (max-width:900px){
  #builder{grid-template-columns:1fr;height:auto}
  #stage{height:80vh}
}

/* ================= PREVIEW SITE ================= */
#site{background:var(--paper)}
.pv-banner{position:sticky;top:0;z-index:50;background:#111;color:#fff;font-size:14px;padding:10px 16px;display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;text-align:center}
.pv-banner b{color:#fff}
.pv-banner a{background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700;padding:6px 14px;border-radius:999px;font-size:13px;white-space:nowrap}
.pv-banner .x{background:none;border:0;color:#888;font-size:20px;cursor:pointer;line-height:1;padding:0 4px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{display:flex;align-items:center;gap:12px;font-family:"Barlow Condensed";font-weight:800;font-size:26px;text-transform:uppercase;text-decoration:none}
.brand img{height:44px;width:auto;max-width:160px;object-fit:contain}
.mark{width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:22px}
.navlinks{display:flex;gap:26px;align-items:center;font-weight:500;font-size:15px}
.navlinks a{text-decoration:none;opacity:.8}.navlinks a:hover{opacity:1}
.callbtn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:var(--accent-ink)!important;opacity:1!important;padding:11px 18px;border-radius:999px;font-weight:700;text-decoration:none;transition:transform .15s,box-shadow .15s}
.callbtn:hover{transform:translateY(-2px);box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent)}
.hero{position:relative;color:#fff;background:#151515;overflow:hidden}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center}
.hero .bg.pattern{background:
  radial-gradient(1200px 500px at 85% -10%, color-mix(in srgb,var(--accent) 55%,transparent), transparent 60%),
  repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 22px), #151515}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.82),rgba(0,0,0,.35))}
.hero .wrap{position:relative;padding-top:96px;padding-bottom:104px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:.14em;font-weight:600;font-size:15px;color:#fff;background:rgba(255,255,255,.1);padding:7px 14px;border-radius:999px;margin-bottom:22px}
.eyebrow i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.hero h1{font-size:clamp(46px,7vw,88px);font-weight:800;max-width:820px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lede{font-size:19px;max-width:560px;margin:22px 0 32px;color:#ddd}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap}
.ghost{display:inline-flex;align-items:center;padding:11px 20px;border-radius:999px;border:1.5px solid rgba(255,255,255,.5);text-decoration:none;font-weight:700;color:#fff;transition:background .15s}
.ghost:hover{background:rgba(255,255,255,.1)}
.trust{background:var(--ink);color:#fff}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.trust div{padding:26px 16px;border-left:1px solid #2c2c2c;text-align:center}
.trust div:first-child{border-left:0}
.trust b{display:block;font-family:"Barlow Condensed";font-size:36px;font-weight:800;color:var(--accent)}
.trust span{font-size:13px;color:#bbb;text-transform:uppercase;letter-spacing:.08em}
section.blk{padding:92px 0}
.kicker{font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:700;font-size:15px}
.blk h2{font-size:clamp(36px,5vw,58px);font-weight:800;margin:10px 0 14px}
.blk .intro{color:var(--muted);max-width:620px;font-size:17px}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px}
.svc{background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:28px 24px;transition:transform .2s,box-shadow .2s,border-color .2s;position:relative}
.svc:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(0,0,0,.08);border-color:var(--accent)}
.svc .n{font-family:"Barlow Condensed";font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.1em}
.svc h3{font-size:26px;font-weight:700;margin:8px 0 8px}
.svc p{color:var(--muted);font-size:15px}
.why{background:var(--cream)}
.why-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.why ul{list-style:none;display:grid;gap:18px;margin-top:28px}
.why li{display:flex;gap:14px}
.why li .ck{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:15px}
.why li b{display:block;font-size:17px}
.why li span{color:var(--muted);font-size:15px}
.why-card{background:var(--ink);color:#fff;border-radius:18px;padding:40px 34px;position:relative;overflow:hidden}
.why-card:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:var(--accent);opacity:.25}
.why-card .big{font-family:"Barlow Condensed";font-weight:800;font-size:64px;color:var(--accent);line-height:1}
.why-card p{color:#ccc;margin:10px 0 24px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:44px;counter-reset:s}
.step{border-top:3px solid var(--accent);padding-top:20px}
.step h3{font-size:26px;margin-bottom:8px}
.step h3:before{counter-increment:s;content:"0" counter(s) " ";color:var(--accent)}
.step p{color:var(--muted)}
.reviews{background:var(--ink);color:#fff;text-align:center}
.reviews .stars{color:#f5b301;font-size:30px;letter-spacing:4px}
.reviews h2{color:#fff}
.reviews .rnote{color:#aaa;max-width:560px;margin:0 auto}
.reviews .ph{margin:32px auto 0;max-width:640px;border:1.5px dashed #444;border-radius:14px;padding:26px;color:#888;font-size:15px}
.quote-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:start}
.contact-list{list-style:none;margin-top:28px;display:grid;gap:16px}
.contact-list li{display:flex;gap:14px;align-items:center;font-size:17px}
.contact-list .ic{width:44px;height:44px;border-radius:12px;background:var(--cream);display:grid;place-items:center;color:var(--accent);font-weight:800;font-family:"Barlow Condensed";font-size:18px}
.contact-list a{text-decoration:none;font-weight:600}
form.qf{background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:32px;display:grid;gap:12px}
form.qf h3{font-size:30px}
form.qf input,form.qf select,form.qf textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px 14px;font-size:15px;outline:none}
form.qf input:focus,form.qf select:focus,form.qf textarea:focus{border-color:var(--accent)}
form.qf textarea{min-height:100px;resize:vertical}
form.qf .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
form.qf button{background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:15px;font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:.06em;font-weight:700;font-size:19px;cursor:pointer}
.formnote{background:#111;color:#fff;border-radius:10px;padding:14px;font-size:14px}
footer.ft{background:#0e0e0e;color:#999;padding:40px 0;font-size:14px}
footer.ft .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer.ft b{color:#fff}
.mobilecall{display:none}
@media (max-width:820px){
  .navlinks a:not(.callbtn){display:none}
  .trust .wrap{grid-template-columns:repeat(2,1fr)}
  .trust div:nth-child(3){border-left:0}
  .trust div{border-top:1px solid #2c2c2c}
  .svc-grid,.steps{grid-template-columns:1fr}
  .why-grid,.quote-grid{grid-template-columns:1fr;gap:36px}
  section.blk{padding:68px 0}
  .hero .wrap{padding-top:64px;padding-bottom:72px}
  form.qf .two{grid-template-columns:1fr}
  .mobilecall{display:flex;position:fixed;left:12px;right:12px;bottom:12px;z-index:40;justify-content:center;padding:15px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  footer.ft{padding-bottom:90px}
}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
</style>
</head>
<body>

<!-- ========================== BUILDER ========================== -->
<div id="builder" class="hidden">
  <aside id="panel">
    <h1>Preview <span>Builder</span></h1>
    <p class="sub">Fill in the prospect's info. The preview updates live — then copy or text the link.</p>

    <div class="sec">The Business</div>
    <div class="f"><label>Business name *</label><input id="name" placeholder="e.g. Summit Peak Roofing"></div>
    <div class="row">
      <div class="f"><label>Trade *</label><select id="trade"></select></div>
      <div class="f"><label>City / area *</label><input id="city" placeholder="Tampa, FL"></div>
    </div>
    <div class="row">
      <div class="f"><label>Business phone *</label><input id="phone" placeholder="(813) 555-0142"></div>
      <div class="f"><label>Years in business</label><input id="years" placeholder="12" inputmode="numeric"></div>
    </div>
    <div class="f"><label>Email <em>(optional)</em></label><input id="email" placeholder="office@business.com"></div>
    <div class="row">
      <div class="f"><label>Google rating <em>(real only)</em></label><input id="rating" placeholder="4.8"></div>
      <div class="f"><label># of reviews</label><input id="reviews" placeholder="126" inputmode="numeric"></div>
    </div>

    <div class="sec">Look &amp; Feel</div>
    <div class="f"><label>Brand color</label><div class="swatches" id="swatches"></div></div>
    <div class="f"><label>Logo image URL <em>(optional — from their FB/Google)</em></label><input id="logo" placeholder="https://…"></div>
    <div class="f"><label>Hero photo URL <em>(optional — a job photo of theirs)</em></label><input id="photo" placeholder="https://…"></div>

    <div class="sec">Content</div>
    <div class="f"><label>Headline <em>(auto-filled — edit if you want)</em></label><input id="headline"></div>
    <div class="f"><label>Services <em>(one per line — "Title: description")</em></label><textarea id="services"></textarea></div>

    <div class="sec">Sent By</div>
    <div class="f"><label>Your name <em>(for the log — not shown to the client)</em></label><input id="rep" placeholder="e.g. Marcus"></div>

    <div class="sec">Your Contact (shows on the preview banner)</div>
    <div class="row">
      <div class="f"><label>Contact name</label><input id="cName" placeholder="Andrew"></div>
      <div class="f"><label>Contact phone</label><input id="cPhone" placeholder="(915) 727-4506"></div>
    </div>

    <div class="actions">
      <button class="btn pri" id="copyBtn">Copy preview link</button>
      <div class="btn-row">
        <button class="btn sec2" id="smsBtn">Text it</button>
        <button class="btn sec2" id="openBtn">Open full page</button>
      </div>
      <button class="btn sec2" id="resetBtn" style="font-size:14px;opacity:.7">Start new prospect</button>
    </div>
  </aside>

  <main id="stage">
    <div class="stagebar">
      <div class="dots"><i></i><i></i><i></i></div>
      <div class="url" id="urlbar">preview</div>
      <div class="devtoggle"><button id="dDesk" class="on">Desktop</button> <button id="dMob">Mobile</button></div>
    </div>
    <div class="framewrap"><iframe id="frame" title="Website preview"></iframe></div>
  </main>
</div>

<!-- ========================== PREVIEW SITE ========================== -->
<div id="site" class="hidden"></div>

<div class="toast" id="toast"></div>

<script>
/* ====================================================================
   DEFAULT CONTACT — shown on the preview banner if the rep leaves it blank.
   Change these to your own name/number before you host the file.
   ==================================================================== */
const DEFAULT_CONTACT = { name: "Andrew", phone: "(915) 727-4506" };
const CREDIT = "Andrew Pedregon";
/* Google Sheet log — paste your Apps Script web app URL here. Leave "" to turn logging off. */
const LOG_URL = "https://script.google.com/macros/s/AKfycbznttzZszlyTHpjs8VrjSO5_G2BLa7F0tEeqimDdHbXYwztm_Z-NJjDt4oaR9eJzS0a/exec";

const PALETTES = ["#c8281e","#e8641b","#1f5fbf","#13795b","#2b2b2b","#7a3fd1","#0e8a99","#b8860b"];

const TRADES = {
  roofing:{label:"Roofing",word:"roof",head:"Roofs built to outlast {city} weather.",lede:"Repairs, replacements and storm damage handled start to finish — with honest quotes and clean job sites.",
    services:["Roof Replacement: Full tear-offs and new installs in shingle, metal and tile.","Roof Repair: Leaks, missing shingles and flashing fixed fast.","Storm Damage: Inspections and help working with your insurance claim.","Free Inspections: A full roof check with photos and a written report.","Gutters: Seamless gutters, guards and downspouts installed right.","Commercial Roofing: Flat roof systems, coatings and maintenance plans."]},
  hvac:{label:"HVAC",word:"comfort",head:"Year-round comfort for {city} homes.",lede:"Heating and cooling repair, installs and tune-ups from techs who show up on time and explain everything.",
    services:["AC Repair: Fast diagnostics and same-day fixes when it counts.","Heating Repair: Furnaces and heat pumps back up and running.","New System Installs: Right-sized, energy-efficient equipment.","Maintenance Plans: Seasonal tune-ups that prevent breakdowns.","Indoor Air Quality: Filtration, purifiers and humidity control.","Ductwork: Cleaning, sealing and repairs for even airflow."]},
  plumbing:{label:"Plumbing",word:"plumbing",head:"Plumbing done right the first time in {city}.",lede:"From leaks to repipes, licensed plumbers with upfront pricing and work that's built to last.",
    services:["Leak Repair: Find and fix leaks before they become damage.","Drain Cleaning: Clogs cleared and lines camera-inspected.","Water Heaters: Tank and tankless repair and installation.","Fixture Installs: Faucets, toilets, sinks and showers.","Repiping: Whole-home repipes with minimal disruption.","Emergency Service: Burst pipes and backups handled fast."]},
  electrical:{label:"Electrical",word:"power",head:"Safe, reliable electrical work in {city}.",lede:"Licensed electricians for repairs, upgrades and new installs — done to code, every time.",
    services:["Panel Upgrades: Modern panels that handle today's demand.","Wiring & Rewiring: Safe wiring for remodels and older homes.","Lighting: Indoor, outdoor and recessed lighting installs.","EV Chargers: Home charging stations installed and permitted.","Troubleshooting: Tripping breakers and dead outlets diagnosed.","Generators: Backup power so you're never left in the dark."]},
  landscaping:{label:"Landscaping",word:"yard",head:"The best-looking yard on the block in {city}.",lede:"Design, installs and weekly care that keep your property looking sharp all season.",
    services:["Lawn Care: Mowing, edging and fertilization on a set schedule.","Landscape Design: Plans built around your space and budget.","Hardscaping: Patios, walkways and retaining walls.","Irrigation: Sprinkler installs, repairs and tune-ups.","Tree & Shrub Care: Trimming, removal and planting.","Seasonal Cleanup: Spring and fall cleanups done in a day."]},
  junk:{label:"Junk Removal",word:"space",head:"Junk gone. Same day in {city}.",lede:"Homes, garages, job sites and offices cleared out fast — we do the lifting, hauling and disposal.",
    services:["Junk Removal: Furniture, appliances and clutter hauled away.","Construction Debris: Job-site cleanouts for contractors.","Yard Waste: Branches, brush and cleanup debris removed.","Estate Cleanouts: Respectful, full-property cleanouts.","Commercial Cleanouts: Offices and retail spaces cleared.","Donation Drop-Offs: Usable items donated, not dumped."]},
  painting:{label:"Painting",word:"finish",head:"Clean lines. Lasting finishes. {city}'s painters.",lede:"Interior and exterior painting with careful prep, protected floors and a spotless cleanup.",
    services:["Interior Painting: Walls, ceilings, trim and doors.","Exterior Painting: Siding, trim and full exteriors.","Cabinet Refinishing: A new kitchen look without a remodel.","Drywall Repair: Patches and texture matched seamlessly.","Commercial Painting: Offices and storefronts on your schedule.","Deck & Fence Staining: Protect and refresh outdoor wood."]},
  concrete:{label:"Concrete",word:"concrete",head:"Concrete work that holds up in {city}.",lede:"Driveways, patios and foundations poured right — strong, level and built to last decades.",
    services:["Driveways: New pours and full replacements.","Patios: Plain, stamped and decorative finishes.","Sidewalks & Walkways: Safe, level paths around your property.","Foundations & Slabs: Solid bases for homes, garages and sheds.","Concrete Repair: Cracks and settling fixed before they spread.","Commercial Flatwork: Parking areas and large-scale pours."]},
  cleaning:{label:"Cleaning",word:"home",head:"Come home to a spotless space in {city}.",lede:"Reliable, background-checked cleaners for homes and offices — on your schedule.",
    services:["Recurring Cleaning: Weekly or bi-weekly visits you can count on.","Deep Cleaning: Top-to-bottom detail for a fresh start.","Move-In / Move-Out: Get your deposit back or start clean.","Office Cleaning: After-hours service for workplaces.","Post-Construction: Dust and debris cleared after a remodel.","Add-Ons: Inside fridge, oven, windows and more."]},
  general:{label:"General Contractor",word:"project",head:"Build it right in {city}.",lede:"Remodels, additions and repairs managed start to finish by one accountable team.",
    services:["Kitchen Remodels: Layouts, cabinets and finishes done right.","Bathroom Remodels: From refresh to full gut renovation.","Additions: More space that looks like it was always there.","Decks & Outdoor Living: Built for how you actually use them.","Repairs & Handyman: The punch list, finally handled.","Commercial Build-Outs: Tenant improvements on schedule."]}
};

/* ---------- encoding helpers ---------- */
const enc = o => { const b = new TextEncoder().encode(JSON.stringify(o)); let s=""; b.forEach(c=>s+=String.fromCharCode(c)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); };
const dec = s => { s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const bin=atob(s); const b=new Uint8Array([...bin].map(c=>c.charCodeAt(0))); return JSON.parse(new TextDecoder().decode(b)); };
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const telHref = p => "tel:" + String(p||"").replace(/[^\d+]/g,"");
const baseUrl = () => location.href.split("#")[0].split("?")[0];
const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };

function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("show"),2200); }

/* ====================================================================
   PREVIEW RENDERER
   ==================================================================== */
function renderSite(d, opts={}){
  const t = TRADES[d.trade] || TRADES.roofing;
  const city = d.city || "your area";
  const cityShort = city.split(",")[0].trim();
  document.documentElement.style.setProperty("--accent", d.color || PALETTES[0]);
  const headline = (d.headline || t.head).replace(/\{city\}/g, cityShort);
  // emphasize last 2 words of headline
  const hw = headline.split(" "); const hl = hw.length>3 ? esc(hw.slice(0,-2).join(" "))+" <em>"+esc(hw.slice(-2).join(" "))+"</em>" : esc(headline);
  const services = (d.services && d.services.length ? d.services : t.services).map(line=>{
    const i=line.indexOf(":"); return i>-1 ? {t:line.slice(0,i).trim(), p:line.slice(i+1).trim()} : {t:line.trim(), p:""};
  }).filter(s=>s.t);
  const name = d.name || "Your Business";
  const phone = d.phone || "(555) 555-5555";
  const initial = esc(name.trim().charAt(0).toUpperCase());
  const logo = d.logo ? `<img src="${esc(d.logo)}" alt="${esc(name)} logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'mark',textContent:'${initial}'}))">` : `<span class="mark">${initial}</span>`;
  const hasRating = d.rating && !isNaN(parseFloat(d.rating));
  const years = d.years && !isNaN(parseInt(d.years)) ? parseInt(d.years) : null;
  const cName = d.cName || DEFAULT_CONTACT.name; const cPhone = d.cPhone || DEFAULT_CONTACT.phone;

  const stats = [
    years ? [years+"+","Years in business"] : ["Local","Owned & operated"],
    hasRating ? [parseFloat(d.rating).toFixed(1)+"★", (d.reviews? d.reviews+" Google reviews":"Google rating")] : ["Free","Estimates"],
    ["Licensed","& insured"],
    ["Fast","Response times"]
  ];

  const banner = opts.noBanner ? "" : `
  <div class="pv-banner" id="pvb">
    <span>👋 This is a <b>free website preview</b> made for <b>${esc(name)}</b>.</span>
    ${cPhone ? `<a href="${telHref(cPhone)}">Like it? Call or text ${esc(cName)} — ${esc(cPhone)}</a>` : `<span>Like it? Reply to the text you got from ${esc(cName)}.</span>`}
    <button class="x" aria-label="Hide" onclick="document.getElementById('pvb').remove()">×</button>
  </div>`;

  document.getElementById("site").innerHTML = `
  ${banner}
  <header class="wrap nav">
    <a class="brand" href="#top">${logo}<span>${esc(name)}</span></a>
    <nav class="navlinks">
      <a href="#services">Services</a><a href="#why">Why Us</a><a href="#quote">Free Quote</a>
      <a class="callbtn" href="${telHref(phone)}">📞 ${esc(phone)}</a>
    </nav>
  </header>

  <section class="hero" id="top">
    <div class="bg ${d.photo?"":"pattern"}" ${d.photo?`style="background-image:url('${esc(d.photo)}')"`:""}></div>
    ${d.photo?'<div class="shade"></div>':""}
    <div class="wrap">
      <div class="eyebrow"><i></i>${esc(t.label)} · ${esc(city)}</div>
      <h1>${hl}</h1>
      <p class="lede">${esc(t.lede)}</p>
      <div class="ctas">
        <a class="callbtn" href="#quote">Get a free quote →</a>
        <a class="ghost" href="${telHref(phone)}">Call ${esc(phone)}</a>
      </div>
    </div>
  </section>

  <div class="trust"><div class="wrap">${stats.map(s=>`<div><b>${esc(s[0])}</b><span>${esc(s[1])}</span></div>`).join("")}</div></div>

  <section class="blk" id="services"><div class="wrap">
    <div class="kicker reveal">What we do</div>
    <h2 class="reveal">${esc(t.label)} services in ${esc(cityShort)}</h2>
    <p class="intro reveal">Whatever the job, you get the same thing: clear pricing, clean work and a crew that finishes what it starts.</p>
    <div class="svc-grid">${services.map((s,i)=>`<div class="svc reveal"><div class="n">0${i+1}</div><h3>${esc(s.t)}</h3>${s.p?`<p>${esc(s.p)}</p>`:""}</div>`).join("")}</div>
  </div></section>

  <section class="blk why" id="why"><div class="wrap why-grid">
    <div>
      <div class="kicker reveal">Why ${esc(name)}</div>
      <h2 class="reveal">Straight answers. Quality work.</h2>
      <ul>
        <li class="reveal"><span class="ck">✓</span><div><b>Upfront pricing</b><span>You know the cost before any work starts — no surprises.</span></div></li>
        <li class="reveal"><span class="ck">✓</span><div><b>Local to ${esc(cityShort)}</b><span>We live and work here, and our reputation rides on every job.</span></div></li>
        <li class="reveal"><span class="ck">✓</span><div><b>Respect for your property</b><span>Protected surfaces and a full cleanup when we're done.</span></div></li>
        <li class="reveal"><span class="ck">✓</span><div><b>We pick up the phone</b><span>Real people, quick callbacks, and clear updates along the way.</span></div></li>
      </ul>
    </div>
    <div class="why-card reveal">
      <div class="big">${years ? years+"+ yrs" : "Free"}</div>
      <p>${years ? `Serving ${esc(cityShort)} for over ${years} years.` : "No-pressure estimates, every time."} Tell us about your ${esc(t.word)} and we'll get back to you fast.</p>
      <a class="callbtn" href="#quote">Request a quote</a>
    </div>
  </div></section>

  <section class="blk"><div class="wrap">
    <div class="kicker reveal">How it works</div>
    <h2 class="reveal">Simple from start to finish</h2>
    <div class="steps">
      <div class="step reveal"><h3>Reach out</h3><p>Call, text or send the quote form — whatever's easiest for you.</p></div>
      <div class="step reveal"><h3>Get your quote</h3><p>We look at the job and give you a clear, written price.</p></div>
      <div class="step reveal"><h3>We get it done</h3><p>The work's scheduled, completed and cleaned up — done right.</p></div>
    </div>
  </div></section>

  <section class="blk reviews"><div class="wrap">
    ${hasRating ? `<div class="stars">★★★★★</div><h2 class="reveal">Rated ${parseFloat(d.rating).toFixed(1)} on Google</h2><p class="rnote reveal">${d.reviews?esc(d.reviews)+" ":""}customers in ${esc(cityShort)} have shared their experience.</p>`
                : `<div class="kicker">Reviews</div><h2 class="reveal">What customers say</h2>`}
    <div class="ph reveal">Your real Google reviews go here — pulled in automatically on the finished site.</div>
  </div></section>

  <section class="blk" id="quote"><div class="wrap quote-grid">
    <div>
      <div class="kicker reveal">Free estimate</div>
      <h2 class="reveal">Let's talk about your ${esc(t.word)}</h2>
      <p class="intro reveal">Send a few details and we'll get back to you with a quote — usually the same day.</p>
      <ul class="contact-list">
        <li class="reveal"><span class="ic">TEL</span><a href="${telHref(phone)}">${esc(phone)}</a></li>
        ${d.email?`<li class="reveal"><span class="ic">@</span><a href="mailto:${esc(d.email)}">${esc(d.email)}</a></li>`:""}
        <li class="reveal"><span class="ic">LOC</span><span>Serving ${esc(city)} &amp; surrounding areas</span></li>
      </ul>
    </div>
    <form class="qf reveal" onsubmit="event.preventDefault();this.querySelector('.formnote').classList.remove('hidden')">
      <h3>Request a quote</h3>
      <div class="two"><input placeholder="Name" required><input placeholder="Phone" required></div>
      <input type="email" placeholder="Email">
      <select><option>Service needed…</option>${services.map(s=>`<option>${esc(s.t)}</option>`).join("")}</select>
      <textarea placeholder="Tell us about the job"></textarea>
      <button type="submit">Send my request</button>
      <div class="formnote hidden">✅ Preview mode — on your live site, this request lands straight in your inbox.</div>
    </form>
  </div></section>

  <footer class="ft"><div class="wrap">
    <div><b>${esc(name)}</b><br>${esc(t.label)} · ${esc(city)}</div>
    <div>${esc(phone)}${d.email?" · "+esc(d.email):""}<br>© ${new Date().getFullYear()} ${esc(name)}<br><span style="opacity:.6">Website by ${esc(CREDIT)}</span></div>
  </div></footer>
  <a class="callbtn mobilecall" href="${telHref(phone)}">📞 Call ${esc(phone)}</a>`;

  document.title = name + " | " + t.label + " in " + cityShort;
  const io = new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} }),{threshold:.12});
  document.querySelectorAll(".reveal").forEach(el=>io.observe(el));
  // safety net: never leave content hidden
  setTimeout(()=>document.querySelectorAll(".reveal:not(.in)").forEach(el=>el.classList.add("in")),1800);
}

/* ====================================================================
   BUILDER LOGIC
   ==================================================================== */
const F = id => document.getElementById(id);
let color = PALETTES[0];
let headlineTouched = false, servicesTouched = false;

function collect(){
  return {
    name:F("name").value.trim(), trade:F("trade").value, city:F("city").value.trim(), phone:F("phone").value.trim(),
    years:F("years").value.trim(), email:F("email").value.trim(), rating:F("rating").value.trim(), reviews:F("reviews").value.trim(),
    color, logo:F("logo").value.trim(), photo:F("photo").value.trim(),
    headline: headlineTouched ? F("headline").value.trim() : "",
    services: servicesTouched ? F("services").value.split("\n").map(s=>s.trim()).filter(Boolean) : [],
    cName:F("cName").value.trim(), cPhone:F("cPhone").value.trim()
  };
}
// strip empty keys so links stay short
const compact = o => Object.fromEntries(Object.entries(o).filter(([k,v])=> Array.isArray(v)? v.length : v));
const link = () => baseUrl() + "#p=" + enc(compact(collect()));

function fillTradeDefaults(){
  const t = TRADES[F("trade").value];
  if(!headlineTouched) F("headline").value = t.head.replace(/\{city\}/g, (F("city").value.split(",")[0].trim()||"your area"));
  if(!servicesTouched) F("services").value = t.services.join("\n");
}
let tmr;
function refresh(){
  fillTradeDefaults();
  clearTimeout(tmr);
  tmr = setTimeout(()=>{
    const l = link();
    F("urlbar").textContent = l;
    F("frame").src = l.replace("#p=","#embed=");
  },150);
}

function initBuilder(){
  F("builder").classList.remove("hidden");
  document.body.style.background = "var(--ink)";
  F("trade").innerHTML = Object.entries(TRADES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join("");
  F("swatches").innerHTML = PALETTES.map((c,i)=>`<button class="sw${i?"":" on"}" style="background:${c}" data-c="${c}" aria-label="Color ${c}"></button>`).join("") + `<input type="color" id="customColor" value="${PALETTES[0]}" title="Custom color" style="width:34px;height:34px;border:0;background:none;padding:0;cursor:pointer">`;
  F("swatches").addEventListener("click",e=>{ const b=e.target.closest(".sw"); if(!b) return; color=b.dataset.c; document.querySelectorAll(".sw").forEach(s=>s.classList.toggle("on",s===b)); document.documentElement.style.setProperty("--accent",color); refresh(); });
  F("customColor").addEventListener("input",e=>{ color=e.target.value; document.querySelectorAll(".sw").forEach(s=>s.classList.remove("on")); document.documentElement.style.setProperty("--accent",color); refresh(); });

  // remember the rep's contact info on this device
  F("cName").value = store.get("pb_cName") || DEFAULT_CONTACT.name;
  F("cPhone").value = store.get("pb_cPhone") || DEFAULT_CONTACT.phone;
  F("rep").value = store.get("pb_rep") || "";
  ["rep","cName","cPhone"].forEach(k=>F(k).addEventListener("change",()=>store.set("pb_"+k,F(k).value.trim())));

  F("headline").addEventListener("input",()=>{headlineTouched=true});
  F("services").addEventListener("input",()=>{servicesTouched=true});
  F("trade").addEventListener("change",()=>{ servicesTouched=false; headlineTouched=false; });
  F("panel").addEventListener("input",refresh);
  F("panel").addEventListener("change",refresh);

  function logSend(action){
    if(!LOG_URL) return;
    const d = collect();
    const payload = JSON.stringify({ action, rep:F("rep").value.trim(), name:d.name, trade:(TRADES[d.trade]||{}).label||d.trade,
      city:d.city, phone:d.phone, email:d.email, link:link() });
    try{
      const blob = new Blob([payload],{type:"text/plain"});
      if(!(navigator.sendBeacon && navigator.sendBeacon(LOG_URL, blob)))
        fetch(LOG_URL,{method:"POST",mode:"no-cors",keepalive:true,headers:{"Content-Type":"text/plain"},body:payload});
    }catch(e){ console.warn("log failed",e); }
  }

  F("copyBtn").onclick = async ()=>{
    if(!F("name").value.trim()||!F("phone").value.trim()){ toast("Add at least the business name and phone"); return; }
    if(!F("rep").value.trim()){ toast("Add your name under Sent By first"); F("rep").focus(); return; }
    const l = link();
    logSend("Copied link");
    try{ await navigator.clipboard.writeText(l); toast("Preview link copied ✓"); }
    catch(e){ prompt("Copy this link:", l); }
  };
  F("smsBtn").onclick = ()=>{
    if(!F("name").value.trim()){ toast("Add the business name first"); return; }
    if(!F("rep").value.trim()){ toast("Add your name under Sent By first"); F("rep").focus(); return; }
    logSend("Texted");
    const who = F("rep").value.trim();
    const body = `Hey! This is ${who}. I put together a free website preview for ${F("name").value.trim()} — take a look: ${link()}`;
    location.href = "sms:" + F("phone").value.replace(/[^\d+]/g,"") + "?&body=" + encodeURIComponent(body);
  };
  F("openBtn").onclick = ()=> window.open(link(),"_blank");
  F("resetBtn").onclick = ()=>{
    if(!confirm("Clear everything and start a new prospect?")) return;
    ["name","city","phone","years","email","rating","reviews","logo","photo"].forEach(k=>F(k).value="");
    headlineTouched=servicesTouched=false; refresh(); toast("Ready for the next one");
  };
  F("dDesk").onclick=()=>{F("frame").classList.remove("mobile");F("dDesk").classList.add("on");F("dMob").classList.remove("on")};
  F("dMob").onclick=()=>{F("frame").classList.add("mobile");F("dMob").classList.add("on");F("dDesk").classList.remove("on")};
  refresh();
}

/* ====================================================================
   ROUTER — #p=... shows the client preview, #embed=... is the builder's
   live frame (no banner), anything else shows the builder
   ==================================================================== */
function route(){
  const h = location.hash;
  const m = h.match(/^#(p|embed)=(.+)$/);
  if(m){
    try{
      const d = dec(m[2]);
      F("builder").classList.add("hidden");
      F("site").classList.remove("hidden");
      document.body.style.background="#fff";
      renderSite(d,{noBanner:m[1]==="embed"});
      if(m[1]==="embed") window.scrollTo(0,0);
      return true;
    }catch(e){ console.error(e); }
  }
  return false;
}
if(!route()) initBuilder();
window.addEventListener("hashchange",()=>{ if(/^#(p|embed)=/.test(location.hash)) route(); });
</script>
</body>
</html>
